name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: type-check + lint ──────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint

  # ── CV Service: Python tests ─────────────────────────────────────────────
  cv-service:
    name: CV Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v
        # Don't fail the whole CI if tests/ dir doesn't exist yet
        continue-on-error: true

  # ── CV Service: Docker build check ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-service

    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forza-cv-service:ci .
